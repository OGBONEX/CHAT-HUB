<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Hub - App</title>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Server Icons Sidebar -->
        <div class="server-sidebar">
            <div class="server-icon active" title="Direct Messages">
                <i class="fa-solid fa-comment-dots"></i>
            </div>
            <div class="sidebar-divider"></div>
            
            <div class="server-icon" title="Chat Hub Community">CH</div>
            
            <div class="sidebar-divider"></div>

            <div class="server-icon action-btn" id="create-server-btn" title="Create a Server">
                <i class="fa-solid fa-plus"></i>
            </div>
            <div class="server-icon action-btn" id="explore-btn" title="Explore">
                <i class="fa-solid fa-compass"></i>
            </div>
        </div>

        <!-- Channel / DM Sidebar -->
        <div class="channel-sidebar">
            <div class="search-bar">
                <input type="text" placeholder="Find or start a conversation">
            </div>
            
            <div class="channel-list">
                <div class="channel"><i class="fa-solid fa-user-group"></i> Friends</div>
                <div class="channel active"><i class="fa-solid fa-inbox"></i> Direct Messages</div>
                
                <div class="category">DIRECT MESSAGES</div>
                
                <div class="dm-user active">
                    <div class="avatar" style="background: #5865F2;">U</div>
                    <div class="dm-info">
                        <span class="dm-name">User 1</span>
                        <span class="dm-status">Hello there!</span>
                    </div>
                </div>
            </div>

            <!-- User Panel -->
            <div class="user-panel">
                <div class="user-info">
                    <div class="avatar" style="background: #23a559;">Y</div>
                    <div>
                        <div class="username">You</div>
                        <div class="status">Online</div>
                    </div>
                </div>
                <div class="user-controls">
                    <i class="fa-solid fa-microphone"></i>
                    <i class="fa-solid fa-headphones"></i>
                    <i class="fa-solid fa-gear" id="settings-btn"></i>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-title">
                    <div class="avatar" style="width: 24px; height: 24px; font-size: 0.7rem; background: #5865F2;">U</div>
                    User 1
                </div>
                <div class="header-actions">
                    <i class="fa-solid fa-phone"></i>
                    <i class="fa-solid fa-video"></i>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div class="message">
                    <div class="avatar" style="background: #5865F2;">U</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="author" style="color: #5865F2;">User 1</span>
                            <span class="time">Today at 4:15 PM</span>
                        </div>
                        <div class="text">Hey! Welcome to Chat Hub.</div>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-wrapper">
                <div class="chat-input">
                    <i class="fa-solid fa-plus"></i>
                    <input type="text" id="message-input" placeholder="Message @User 1" autocomplete="off">
                    <div class="input-icons">
                        <i class="fa-solid fa-face-smile"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="settings-modal">
            <button class="settings-close" id="close-settings">&times;</button>
            
            <div class="settings-sidebar">
                <div class="settings-tab active">My Account</div>
                <div class="settings-tab">Profile</div>
                <div class="settings-tab">Voice & Video</div>
                <div class="settings-tab" style="margin-top: auto; color: #ff5c46;">Log Out</div>
            </div>

            <div class="settings-content">
                <h2>My Account</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" value="You" id="settings-username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" value="you@example.com" disabled style="opacity: 0.5;">
                </div>
                <div class="form-group">
                    <label>Profile Color (Hex)</label>
                    <input type="text" value="#5865F2" id="settings-color">
                </div>
                <button class="btn-full-profile" style="width: auto; padding: 10px 20px;">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
