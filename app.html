<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Hub - App</title>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Server Icons Sidebar -->
        <div class="server-sidebar">
            <div class="server-icon active" title="Direct Messages">
                <i class="fa-solid fa-comment-dots"></i>
            </div>
            <div class="sidebar-divider"></div>
            <div class="server-icon action-btn" id="create-server-btn" title="Create a Server">
                <i class="fa-solid fa-plus"></i>
            </div>
            <div class="server-icon action-btn" id="explore-btn" title="Explore Servers">
                <i class="fa-solid fa-compass"></i>
            </div>
        </div>

        <!-- Channel / DM Sidebar -->
        <div class="channel-sidebar">
            <div class="search-bar">
                <input type="text" placeholder="Find or start a conversation">
            </div>
            
            <div class="channel-list">
                <div class="channel" id="nav-friends"><i class="fa-solid fa-user-group"></i> Friends</div>
                <div class="channel active" id="nav-dms"><i class="fa-solid fa-inbox"></i> Direct Messages</div>
                
                <div class="category" id="dm-category">DIRECT MESSAGES</div>
                
                <div id="dm-list-container">
                    <div style="padding: 16px; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                        No messages yet.
                    </div>
                </div>
            </div>

            <!-- User Panel -->
            <div class="user-panel">
                <div class="user-info">
                    <div class="avatar" id="user-avatar" style="background: #23a559;">U</div>
                    <div>
                        <div class="username" id="user-display-name">Loading...</div>
                        <div class="status">Online</div>
                    </div>
                </div>
                <div class="user-controls">
                    <i class="fa-solid fa-microphone"></i>
                    <i class="fa-solid fa-headphones"></i>
                    <i class="fa-solid fa-gear" id="settings-btn" style="cursor: pointer;"></i>
                </div>
            </div>
        </div>

        <!-- Main Chat Area (DMs) -->
        <div class="chat-area" id="view-dms">
            <div id="dm-empty-state" style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted);">
                <i class="fa-regular fa-comments" style="font-size: 4rem; margin-bottom: 20px;"></i>
                <h2>Welcome to Chat Hub</h2>
                <p>Select a friend from the Friends tab to start chatting.</p>
            </div>

            <div id="dm-active-chat" style="display: none; flex: 1; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-title">
                        <div class="avatar" id="dm-chat-avatar" style="width: 24px; height: 24px; font-size: 0.7rem; background: #5865F2;">U</div>
                        <span id="dm-chat-name">User</span>
                    </div>
                </div>
                
                <div class="chat-messages" id="dm-messages-container"></div>
                
                <div class="chat-input-wrapper">
                    <div class="chat-input">
                        <i class="fa-solid fa-plus"></i>
                        <input type="text" id="dm-message-input" placeholder="Message" autocomplete="off">
                        <div class="input-icons">
                            <i class="fa-solid fa-face-smile"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area (Friends View) -->
        <div class="chat-area" id="view-friends" style="display: none;">
            <div class="chat-header">
                <div class="chat-title"><i class="fa-solid fa-user-group" style="margin-right: 8px;"></i> Friends</div>
            </div>
            <div style="padding: 20px; flex: 1; overflow-y: auto;">
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="friend-search" placeholder="Enter a username to add..." style="flex: 1; padding: 10px; background: var(--bg-server); border: none; border-radius: 4px; color: white; outline: none;">
                    <button style="background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 4px; font-weight: bold; cursor: pointer;" onclick="addFriend()">Send Request</button>
                </div>
                
                <h3 style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px;">Your Friends</h3>
                <div id="friends-list">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">You don't have any friends yet. Add some!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="settings-modal">
            <button class="settings-close" id="close-settings">&times;</button>
            <div class="settings-sidebar">
                <div class="settings-tab active">My Account</div>
                <div class="settings-tab">Profile</div>
                <div class="settings-tab" style="margin-top: auto; color: #ff5c46;" onclick="logout()">Log Out</div>
            </div>
            <div class="settings-content">
                <h2>My Account</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="settings-username" value="">
                </div>
                <div class="form-group">
                    <label>Profile Accent Color</label>
                    <input type="color" id="settings-color" value="#5865F2" style="height: 40px; cursor: pointer;">
                </div>
                <button class="btn-full-profile" style="width: auto; padding: 10px 20px;" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
