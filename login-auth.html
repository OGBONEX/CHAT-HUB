<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Hub - Log In</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: var(--bg-main); }
        .auth-box { background: var(--bg-panel); padding: 40px; border-radius: 12px; width: 100%; max-width: 420px; border: 1px solid var(--border-color); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-box h2 { margin-bottom: 10px; font-size: 2rem; }
        .auth-box p { color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-main); text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px 16px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 6px; color: white; font-size: 1rem; outline: none; transition: border 0.2s; }
        .input-group input:focus { border-color: var(--accent); }
        .auth-btn { width: 100%; background: var(--accent); color: white; padding: 14px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .auth-btn:hover { background: var(--accent-hover); }
        .switch-auth { margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
        .switch-auth a { color: var(--accent); font-weight: bold; text-decoration: none; }
        .switch-auth a:hover { text-decoration: underline; }
        .back-link { margin-top: 15px; display: block; font-size: 0.9rem; color: var(--text-muted); text-decoration: none;}
        .back-link:hover { color: white; }
    </style>
</head>
<body>

    <div class="auth-box">
        <h2>Welcome Back</h2>
        <p>We're so excited to see you again!</p>
        
        <div class="input-group">
            <label>Email or Username</label>
            <input type="text" id="login-id" placeholder="name@example.com">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••">
        </div>
        
        <button class="auth-btn" onclick="loginAccount()">Log In</button>
        
        <div class="switch-auth">
            Need an account? <a href="login.html">Register</a>
        </div>
        
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        async function loginAccount() {
            const identifier = document.getElementById("login-id").value;
            const password = document.getElementById("login-password").value;

            if (!identifier || !password) {
                alert("Please fill in all fields.");
                return;
            }

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ identifier, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("chathub_username", data.username);
                    alert("Login successful! Redirecting...");
                    window.location.href = "app.html";
                } else {
                    alert("Invalid username or password.");
                }
            } catch (err) {
                alert("Could not connect to server.");
            }
        }
    </script>
</body>
</html>
